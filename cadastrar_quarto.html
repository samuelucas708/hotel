<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel - Cadastro de Quarto</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #780101;
        }

        .form {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgb(139, 0, 0);
        }

        .titulo_principal {
            color: rgb(198, 0, 0);
            background-color: white;
            border: 3px solid rgb(6, 6, 174);
            margin: 30px auto;
            border-radius: 30px;
            width: 300px;
            padding: 10px;
        }

        .titulo_secundario {
            color: #99ff00;
        }

        .input {
            border: 1px solid darkblue;
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            width: 330px;
        }

        .btn-enviar {
            width: 350px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background-color: darkblue;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-enviar:hover {
            background-color: #2563EB;
        }

    </style>

</head>

<body>

    <h1 class="titulo_principal">
        🏨 Hotel Primavera
    </h1>

    <h2 class="titulo_secundario">
        Cadastro de Quarto
    </h2>

    <form class="form" action="salvar_quarto.php" method="post">

        <label class="label" for="id_hotel">
            ID do Hotel
        </label>
        <br>

        <input
            class="input"
            type="number"
            id="id_hotel"
            name="id_hotel"
            placeholder="Ex: 1"
            required
        >

        <br>

        <label class="label" for="numero_quarto">
            Número do Quarto
        </label>
        <br>

        <input
            class="input"
            type="text"
            id="numero_quarto"
            name="numero_quarto"
            placeholder="Ex: 101, 202, A1"
            required
        >

        <br>

        <label class="label" for="tipo_quarto">
            Tipo de Quarto
        </label>
        <br>

        <select
            class="input"
            id="tipo_quarto"
            name="tipo_quarto"
            required
        >

            <option value="">
                Selecione o tipo
            </option>

            <option value="Solteiro">
                Solteiro
            </option>

            <option value="Casal">
                Casal
            </option>

            <option value="Suíte Luxo">
                Suíte Luxo
            </option>

        </select>

        <br>

        <label class="label" for="preco_diaria">
            Preço da Diária (R$)
        </label>
        <br>

        <input
            class="input"
            type="number"
            id="preco_diaria"
            name="preco_diaria"
            placeholder="Ex: 150.00"
            step="0.01"
            min="0"
            required
        >

        <br>

        <button class="btn-enviar" type="submit">
            SALVAR
        </button>

    </form>

</body>

</html>
